<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Licencias</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js"></script>
</head>
<body>
<main>
  <h1>Licencias</h1>
  <form id="filters">
    <label>Cliente<select id="customerId"><option value="">Todos</option></select></label>
    <label>Estado<select id="status"><option value="">Todos</option><option>ACTIVA</option><option>SUSPENDIDA</option><option>REVOCADA</option></select></label>
    <div class="actions"><button type="button" onclick="load()">Filtrar</button></div>
  </form>
  <table>
    <thead><tr><th>Licencia</th><th>Cliente</th><th>Vigencia</th><th>Límites</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
api("/api/customers").then(cs => customerId.innerHTML += cs.map(c => `<option value="${c.id}">${c.commercialName}</option>`).join(""));
async function act(id, action) { await api(`/api/licenses/${id}/${action}`, { method: "POST", body: "{}" }); load(); }
async function renew(id) {
  const expiresAt = prompt("Nueva fecha de vencimiento (YYYY-MM-DD)");
  if (expiresAt) { await api(`/api/licenses/${id}/renew`, { method: "POST", body: JSON.stringify({ expiresAt }) }); load(); }
}
async function load() {
  const qs = new URLSearchParams();
  if (customerId.value) qs.set("customerId", customerId.value);
  if (status.value) qs.set("status", status.value);
  const licenses = await api(`/api/licenses?${qs}`);
  rows.innerHTML = licenses.map(l => `<tr>
    <td>${l.licenseId}</td><td>${l.customerName}</td><td>${fmtDate(l.issuedAt)} a ${fmtDate(l.expiresAt)}</td>
    <td>Eventos ${l.maxActiveEvents}<br>Estaciones ${l.maxWorkstations}<br>Bases ${l.maxDatabases}</td><td>${l.status}</td>
    <td class="actions"><button onclick="download('/api/licenses/${l.id}/download-dat')">DAT</button><button class="secondary" onclick="download('/api/licenses/${l.id}/download-json')">JSON</button><button onclick="renew(${l.id})">Renovar</button><button class="warn" onclick="act(${l.id}, 'suspend')">Suspender</button><button class="danger" onclick="act(${l.id}, 'revoke')">Revocar</button></td>
  </tr>`).join("");
}
load();
</script>
</body>
</html>
